[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-harness"
version = "0.1.0"
description = "A small, explicit Docker-backed coding agent runtime"
requires-python = ">=3.12"
dependencies = ["openai>=2,<3", "pydantic>=2.12,<3", "python-dotenv>=1,<2"]

[project.scripts]
agent-harness = "agent_harness.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["docker: requires Docker and the locally built execution image"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["runs", ".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# Small bounded local artifact operations are synchronous. Timeout arguments are
# transport settings in addition to the runtime's outer asyncio deadline.
ignore = ["ASYNC109", "ASYNC240"]
